<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartFinder · spare-parts search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1b1a'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='%23ffd166' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='%23ffd166' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="top">
  <a class="brand" href="/">Part<b>Finder</b></a>
  <p class="facts">
    <span><b>{{ "{:,}".format(stats.parts) }}</b> parts</span>
    <span><b>{{ stats.words }}</b> words indexed</span>
    <span><b>{{ stats.trie_nodes }}</b> trie nodes</span>
  </p>
</header>

<main>
  <section class="hero">
    <h1>Find an engine part, <em>even if you misspell it.</em></h1>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="query" type="text" placeholder="Try: fule filtr 6.7" autocomplete="off" spellcheck="false" autofocus
             aria-label="Search parts" aria-controls="suggestions">
      <kbd id="tab-hint" hidden>Tab</kbd>
      <ul id="suggestions" role="listbox" hidden></ul>
    </div>
    <p class="examples" id="examples">
      <span>Examples</span>
      <button>fuel filter</button>
      <button>fule filtr 6.7</button>
      <button>tubrocharger truck</button>
      <button>oil pres sens</button>
      <button>alternater bus 15</button>
      <button>PF-100005</button>
    </p>
  </section>

  <section class="body" id="body" hidden>
    <div class="results">
      <p class="status" id="status"></p>
      <p class="showing" id="showing" hidden></p>
      <ol id="results"></ol>
    </div>

    <aside class="how">
      <h2>How this search worked</h2>
      <ol id="steps"></ol>
    </aside>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
